<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الإدارة - ZAMEL</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 24px; background: #f5f7fb; color: #222; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 6px 18px rgba(0,0,0,0.08); max-width: 700px; margin: 40px auto; }
  </style>
</head>
<body>
  <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin: 24px auto 8px; max-width: 700px;">
    <a href="index.html" style="text-decoration:none; color:#0056b3; font-weight:bold;">← العودة إلى الرئيسية</a>
    <a href="banned.html" style="text-decoration:none; color:#c0392b; font-weight:bold;">الصفحة المحظورة</a>
  </div>
  <div class="card">
    <h2>لوحة الإدارة</h2>
    <p>يتم التحقق من صلاحية الوصول...</p>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js';
    import {
      initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
      CACHE_SIZE_UNLIMITED, doc, getDoc
    } from 'https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyCB-cKo0YJ5K9XO4yHFZoSQVw2EBb5bBIA',
      authDomain: 'yassin0.firebaseapp.com',
      projectId: 'yassin0',
      storageBucket: 'yassin0.firebasestorage.app',
      messagingSenderId: '272988590091',
      appId: '1:272988590091:web:6c59826ba304314947f70e',
      measurementId: 'G-Q6F9XRG6KD'
    };

    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, {
      localCache: persistentLocalCache({
        cacheSizeBytes: CACHE_SIZE_UNLIMITED,
        tabManager: persistentMultipleTabManager()
      })
    });
    const auth = getAuth(app);

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }

      try {
        const userDoc = await getDoc(doc(db, 'users', user.uid));
        const role = userDoc.exists() ? (userDoc.data()?.role || 'user') : 'user';

        if (role !== 'admin') {
          window.location.href = 'index.html';
          return;
        }

        document.querySelector('p').textContent = 'تم التحقق من صلاحية الوصول بنجاح.';
      } catch (error) {
        console.error('Admin guard failed:', error);
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
