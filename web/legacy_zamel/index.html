    <script>
        window.__zamelServiceWorkerRegistered = false;
        window.registerAppServiceWorker = function () {
            if (window.__zamelServiceWorkerRegistered || !('serviceWorker' in navigator)) {
                return;
            }
            window.__zamelServiceWorkerRegistered = true;
            navigator.serviceWorker.register('./service-worker.js')
                .then((registration) => {
                    console.log('Service Worker registered', registration.scope);
                    if (registration.waiting) {
                        registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                    }
                })
                .catch((error) => {
                    console.warn('Service Worker registration failed:', error);
                });
        };
        window.addEventListener('load', window.registerAppServiceWorker);
    </script>
